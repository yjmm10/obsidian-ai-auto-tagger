name: Release Obsidian plugin

# 仅在推送「版本 tag」时触发（如 1.0.0）。
# 正常工作流：本地修改 → 更新 CHANGELOG.md → `npm version patch`(自动 bump+commit+tag)
#            → `git push && git push --tags` → 此处自动构建并发布 Release。
on:
  push:
    tags:
      - "*"

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest_version" ]; then
            echo "::error::Tag ($tag) 与 manifest.json 版本 ($manifest_version) 不一致，请先运行 \`npm version\` 更新版本号。"
            exit 1
          fi

      - name: Extract changelog for this version
        run: |
          node -e "
          const fs=require('fs');
          const tag=process.env.TAG;
          const md=fs.readFileSync('CHANGELOG.md','utf8');
          const lines=md.split('\n');
          let cap=false, out=[];
          for(const l of lines){
            const m=l.match(/^##\s+\[([^\]]+)\]/);
            if(m){ if(m[1]===tag){cap=true; continue;} else if(cap){break;} }
            if(cap) out.push(l);
          }
          fs.writeFileSync('release_notes.md', out.join('\n').trim()+'\n');
          "
        env:
          TAG: ${{ github.ref_name }}

      - name: Package release assets
        run: |
          mkdir -p dist
          cp main.js manifest.json styles.css dist/
          ls -lh dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # 用 CHANGELOG.md 中对应版本段作为发布说明，结构化呈现功能点与改进
          body_path: release_notes.md
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
